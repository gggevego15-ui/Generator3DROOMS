name: Validate Generator3DROOMS browser workspace

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
      - ".github/workflows/unity-webgl.yml"
  pull_request:
    paths:
      - "web/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
      - ".github/workflows/unity-webgl.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate browser WebGL app
        run: |
          test -s web/index.html
          test -s web/styles.css
          test -s web/app.js
          test -s web/unity-bridge.js
          test -s web/three-scene.js
          node --check web/app.js
          node --check web/unity-bridge.js
          node --check --input-type=module < web/three-scene.js
          node scripts/validate-catalog.cjs
          grep -q 'three-scene.js' web/unity-bridge.js
          grep -q 'THREE.WebGLRenderer' web/three-scene.js
          grep -q 'OrbitControls' web/three-scene.js
          grep -q 'GLTFLoader' web/three-scene.js
          grep -q 'GLTFExporter' web/three-scene.js
          grep -q 'function exportGLB' web/three-scene.js
          grep -q 'id="export3dBtn"' web/index.html
          grep -q 'exportGLB:()=>api?.exportGLB()' web/unity-bridge.js
          grep -q 'function addAsset' web/three-scene.js
          grep -q 'https://api.polyhaven.com/assets?type=models' web/app.js
          grep -q 'Number(value) >= 4096' web/app.js
          grep -q 'catalogRoomFilter' web/index.html
          grep -q 'https://api.polyhaven.com/files/' web/three-scene.js
          grep -q '4K model added' web/three-scene.js
          grep -q 'data-category="Free 3D"' web/index.html
          grep -q 'verified 4K CC0 models' web/app.js
          grep -q 'addAsset:asset=>api?.addAsset(asset)' web/unity-bridge.js
          grep -q 'Generator3DROOMS-WebGL' .github/workflows/unity-webgl.yml
          echo "Static browser WebGL checks passed. Live browser/GPU behavior is not tested in CI."
