name: Validate Generator3DROOMS browser workspace

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
      - ".github/workflows/unity-webgl.yml"
  pull_request:
    paths:
      - "web/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
      - ".github/workflows/unity-webgl.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate browser WebGL app
        run: |
          test -s web/index.html
          test -s web/styles.css
          test -s web/app.js
          test -s web/unity-bridge.js
          test -s web/three-scene.js
          node --check web/app.js
          node --check web/unity-bridge.js
          node --check --input-type=module < web/three-scene.js
          node scripts/validate-catalog.cjs
          grep -q 'three-scene.js' web/unity-bridge.js
          grep -q 'THREE.WebGLRenderer' web/three-scene.js
          grep -q 'OrbitControls' web/three-scene.js
          grep -q 'Generator3DROOMS-WebGL' .github/workflows/unity-webgl.yml
          echo "Static browser WebGL checks passed. Live browser/GPU behavior is not tested in CI."
