name: Build Generator3DROOMS WebGL site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/**"
      - ".github/workflows/unity-webgl.yml"
  pull_request:
    paths:
      - "web/**"
      - "scripts/**"
      - ".github/workflows/unity-webgl.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webgl-site:
    name: Validate browser WebGL app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate browser app
        run: |
          test -s web/index.html
          test -s web/styles.css
          test -s web/app.js
          test -s web/unity-bridge.js
          test -s web/three-scene.js
          node --check web/app.js
          node --check web/unity-bridge.js
          node --check --input-type=module < web/three-scene.js
          node scripts/validate-catalog.cjs
          grep -q 'three-scene.js' web/unity-bridge.js
          grep -q 'THREE.WebGLRenderer' web/three-scene.js
          echo "Browser WebGL app validated. No Unity license or Unity editor is required."
      - name: Package static WebGL site
        run: |
          mkdir -p dist
          cp -R web/. dist/
          test -s dist/index.html
          test -s dist/three-scene.js
      - name: Upload browser WebGL site
        uses: actions/upload-artifact@v4
        with:
          name: Generator3DROOMS-WebGL
          path: dist/
          if-no-files-found: error
          retention-days: 14
